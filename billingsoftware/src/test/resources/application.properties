spring.application.name=billingsoftware
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:billing_app}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:123456}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
server.servlet.context-path=

aws.access.key=${AWS_ACCESS:dummy_access}
aws.secret.key=${AWS_SECRET:dummy_secret}
aws.region=${AWS_REGION:us-east-1}
aws.bucket.name=${AWS_BUCKET_NAME:dummy_bucket}

jwt.secret.key=${JWT_SECRET:thisismysecretkeyfortheupcomingproject}
jwt.access-token.expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
jwt.refresh-token.expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}
auth.refresh-token.cookie-secure=${AUTH_REFRESH_COOKIE_SECURE:false}
auth.refresh-token.cookie-same-site=${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
auth.refresh-token.cookie-path=${AUTH_REFRESH_COOKIE_PATH:/}

payos.client.id=${PAYOS_CLIENT:dummy_client}
payos.api.key=${PAYOS_API:dummy_api}
payos.checksum.key=${PAYOS_CHECKSUM:dummy_checksum}
logging.level.org.springframework.web=TRACE
logging.level.org.springframework.security=TRACE
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://54.254.162.86:5173,http://localhost:5173}
